# Dependencies
markdown:         kramdown
highlighter:      rouge
# Setup
title:            Xiaofu Jin
tagline:          'Humboldt Research Fellow'
description:      'Xiaofu Jin is a Humboldt Research Fellow at the University of Stuttgart working on human understanding and modeling and on AI for human empowerment.'
url:              https://xiaofu-jin.github.io
baseurl:          ''
                  # the optional subpath of your site, e.g. "/blog"
